<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#13293d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>アイアン・フロント — ヨーロッパ 1936</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <div id="map-root"></div>
    <div id="hud"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">IRON FRONT</div>
        <div class="boot-sub">ヨーロッパ 1936</div>
        <div class="boot-bar"><span id="boot-fill"></span></div>
        <div class="boot-status" id="boot-status">戦域地図を読み込み中…</div>
      </div>
    </div>
  </div>
  <script>
/* Boot guard. Runs as a classic script so it executes even when the module
   bundle below fails to load or parse -- which is the one failure the boot
   screen cannot otherwise report, because its static text is identical to the
   first progress message. */
(function () {
  var reported = false;
  function show(title, detail) {
    if (reported) return;
    reported = true;
    var el = document.getElementById('boot-status');
    if (!el) return;
    el.textContent = title;
    el.style.color = '#d2453a';
    var d = document.createElement('div');
    d.className = 'boot-detail';
    d.textContent = detail || '';
    el.parentNode.appendChild(d);
  }
  window.__bootFail = show;

  /* A build's chunk names are content hashes, so every deploy replaces them and
     deletes the old ones. A returning visitor holding a cached index.html then
     asks for a chunk that no longer exists and gets a 404 -- which is what
     happened to assets/Hud-XWMYDJ55.js after a redeploy. Reloading picks up the
     current index.html and its current chunk names. Once per session, so a
     genuinely missing file cannot become a refresh loop. */
  var RELOAD_KEY = 'hoi4.staleReload';
  function looksStale(url) {
    return /\/assets\/[^/]+-[A-Za-z0-9_-]{6,}\.(js|css)$/.test(String(url || ''));
  }
  function recover(url) {
    try {
      if (sessionStorage.getItem(RELOAD_KEY)) return false;
      sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
    } catch (err) {
      return false;      /* private mode: fall through to the message */
    }
    location.reload();
    return true;
  }
  function reportAsset(url) {
    if (looksStale(url) && recover(url)) return;
    /* Two different failures, and they used to share one message that named
       only the second. A path under /src/ really is the dev entry point being
       served raw; a hashed chunk is a build that went missing. */
    if (/\/src\/|\.ts(\?|$)/.test(String(url || ''))) {
      show('ゲームのコードを読み込めませんでした。',
        'ブラウザが ' + url + ' を拒否しました。これは開発用のエントリポイントで、' +
        'TypeScript のソースは Vite 上でしか実行できません。配信するには' +
        'ビルド (npm run build) して dist/ を配信してください。');
    } else {
      show('ゲームのコードを読み込めませんでした。',
        'ブラウザが ' + url + ' を読み込めませんでした。公開が更新された直後に' +
        '古いページが残っていると起こります。再読み込みしても直らない場合は、' +
        'ブラウザのキャッシュを消してください。');
    }
  }

  /* Vite raises this when a dynamically imported chunk fails to load, which is
     exactly the stale-deploy case and does not surface as a script error. */
  window.addEventListener('vite:preloadError', function (e) {
    var url = (e && e.payload && e.payload.message) || '';
    if (recover(url)) { e.preventDefault(); return; }
    reportAsset(url);
  });

  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      reportAsset(t.src || t.href);
      return;
    }
    show('起動エラー。', String((e && e.message) || e));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var reason = (e && e.reason) || {};
    var text = String(reason.stack || reason.message || e.reason);
    /* A failed dynamic import arrives here as a rejection naming the chunk. */
    var m = text.match(/https?:\/\/[^\s'")]+/);
    if (m && looksStale(m[0])) { reportAsset(m[0]); return; }
    show('起動エラー。', text);
  });
  setTimeout(function () {
    if (!window.__bootStarted) {
      show('ゲームのコードが起動しませんでした。',
        'index.html は読み込めましたが、スクリプトが実行されませんでした。' +
        'ビルド成果物 (npm run build && npm run preview) か開発サーバー (npm run dev) ' +
        'を使ってください。ファイルシステムから直接開いた場合や、リポジトリを' +
        'そのまま静的配信した場合は実行できません。');
    } else if (!window.__gameReady) {
      show('読み込み中です。', '地図データの取得に想定以上の時間がかかっています。');
    }
  }, 10000);
})();
</script>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
