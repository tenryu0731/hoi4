<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#13293d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<title>Iron Front — Europe 1936</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app">
    <div id="map-root"></div>
    <div id="hud"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">IRON FRONT</div>
        <div class="boot-sub">Europe 1936</div>
        <div class="boot-bar"><span id="boot-fill"></span></div>
        <div class="boot-status" id="boot-status">Loading theatre map…</div>
      </div>
    </div>
  </div>
  <script>
/* Boot guard. Runs as a classic script so it executes even when the module
   bundle below fails to load or parse -- which is the one failure the boot
   screen cannot otherwise report, because its static text is identical to the
   first progress message. */
(function () {
  var reported = false;
  function show(title, detail, offerSingleFile) {
    if (reported) return;
    reported = true;
    var el = document.getElementById('boot-status');
    if (!el) return;
    el.textContent = title;
    el.style.color = '#d2453a';
    var d = document.createElement('div');
    d.className = 'boot-detail';
    d.textContent = detail || '';
    if (offerSingleFile) {
      // Same directory, and self-contained: whatever is serving this page
      // wrongly can still serve that one correctly.
      var a = document.createElement('a');
      a.href = './play.html';
      a.textContent = 'Open the single-file build instead →';
      d.appendChild(document.createElement('br'));
      d.appendChild(a);
    }
    el.parentNode.appendChild(d);
  }
  window.__bootFail = show;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      show('Could not load the game code.',
        'The browser refused ' + (t.src || t.href) + '. This page is the ' +
        'development entry point: its TypeScript sources only run under Vite. ' +
        'To host the game, publish a production build (npm run build) and serve ' +
        'dist/.', true);
      return;
    }
    show('Startup error.', String((e && e.message) || e));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Startup error.', String((e && e.reason && (e.reason.stack || e.reason.message)) || e.reason));
  });
  setTimeout(function () {
    if (!window.__bootStarted) {
      show('The game code never started.',
        'index.html loaded but its script did not run. Serve a production build ' +
        '(npm run build && npm run preview) or the dev server (npm run dev) -- ' +
        'opening index.html from the file system, or from a plain static server ' +
        'pointed at the repository, cannot execute it.', true);
    } else if (!window.__gameReady) {
      show('Still loading.', 'The map data is taking unusually long to arrive.');
    }
  }, 10000);
})();
</script>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
