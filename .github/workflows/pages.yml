name: Deploy to GitHub Pages

# Publishing the repository itself does not work: index.html is the Vite entry
# point and its TypeScript sources are not runnable in a browser. This builds
# first and publishes dist/, which is what the site needs to be.

on:
  push:
    branches:
      - main
      - claude/hoi4-grand-strategy-game-33etuq
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The baked map and the generated art are committed, so this is only the
      # bundle step -- no Natural Earth download, and no chance of the published
      # map drifting from the one the tests were verified against.
      - run: npm run build:app
      - run: npm run build:single && cp play.html dist/play.html
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
